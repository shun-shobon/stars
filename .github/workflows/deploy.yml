# This workflow is managed by gh actions-lock.
name: Deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    outputs:
      version-tag: ${{ steps.version-tag.outputs.tag }}
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup | Development environment
        uses: $/.github/actions/setup

      - name: Setup | Resolve version tag
        id: version-tag
        env:
          SHA: ${{ github.sha }}
        run: echo "tag=$(git rev-parse --short "$SHA")" >> "$GITHUB_OUTPUT"

      - name: Upload | Comment building status
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body-file - <<EOF
          ### <span aria-hidden="true">🚧</span> Deploy Preview building...

          | Name | Link |
          | --- | --- |
          | <span aria-hidden="true">🔨</span> Latest commit | $SHA |
          | <span aria-hidden="true">🔍</span> Latest deploy log | $RUN_URL |
          EOF

      - name: Build | Vite
        run: pnpm run build

      - name: Upload | Worker version
        id: upload
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: >-
            versions upload
            --tag "${{ steps.version-tag.outputs.tag }}"
            --message "${{ github.event_name == 'pull_request' && format('Preview deployment for PR #{0}', github.event.pull_request.number) || 'Release deployment' }}"

      - name: Upload | Comment preview URL
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PREVIEW_URL: ${{ steps.upload.outputs.deployment-url }}
        run: |
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body-file - <<EOF
          ### <span aria-hidden="true">✅</span> Deploy Preview ready!

          | Name | Link |
          | --- | --- |
          | <span aria-hidden="true">🔨</span> Latest commit | $SHA |
          | <span aria-hidden="true">🔍</span> Latest deploy log | $RUN_URL |
          | <span aria-hidden="true">🌐</span> Preview link | [$PREVIEW_URL]($PREVIEW_URL) |
          EOF

  publish:
    needs: upload
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    environment:
      name: Production
      url: ${{ steps.publish.outputs.deployment-url }}
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup | Development environment
        uses: $/.github/actions/setup

      - name: Setup | Resolve version ID
        id: version-id
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERSION_TAG: ${{ needs.upload.outputs.version-tag }}
        run: |
          version_id="$(pnpm exec wrangler versions list --json | jq -er --arg tag "$VERSION_TAG" '[.[] | select(.annotations."workers/tag" == $tag)] | sort_by(.metadata.created_on) | last | .id')"
          echo "id=$version_id" >> "$GITHUB_OUTPUT"

      - name: Run | Deploy version
        id: publish
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: versions deploy ${{ steps.version-id.outputs.id }} -y
